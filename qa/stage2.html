<!doctype html><html lang="ko"><meta charset="utf-8"><title>2단계 동작 검증</title><style>body{background:#0f1729;color:#eef7ff;font:16px/1.7 sans-serif;padding:24px}.stage,#panel{display:none}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js"}}</script><h1>2단계 로직 검증 (WebGL 렌더링 제외)</h1><ol id="results"></ol><pre id="details"></pre><div class="stage"><div id="canvas-container"></div></div><div id="panel"></div><script type="module">
import * as THREE from 'three';import{solveCollision,CollisionMotion,createCollision}from'/js/sims/collision.js';import{CoasterMotion,createCoaster}from'/js/sims/coaster.js';
const results=document.getElementById('results');function assert(v,t){if(!v)throw new Error(t)}function test(name,fn){const li=document.createElement('li');try{fn();li.textContent='PASS: '+name}catch(e){li.textContent='FAIL: '+name+' / '+e.message}results.append(li)}
test('질량·반발계수 54개 조합의 운동량·에너지',()=>{for(const massA of[1,5,10])for(const massB of[1,3,10])for(const restitution of[0,.25,1])for(const speedA of[1,10]){const r=solveCollision({massA,massB,restitution,speedA});assert(Math.abs(r.momentumBefore-r.momentumAfter)<1e-9,'운동량');assert(r.energyAfter<=r.energyBefore+1e-9,'에너지 증가');if(restitution===1)assert(Math.abs(r.energyAfter-r.energyBefore)<1e-9,'탄성 에너지')}});
test('완전비탄성 공은 겹치지 않고 붙어서 이동',()=>{const m=new CollisionMotion({massA:5,massB:2,speedA:5,restitution:0});for(let i=0;i<1600;i++){m.step(1/120);assert(m.xB-m.xA>=m.radiusA+m.radiusB-1e-9,'공 겹침')}assert(m.collided&&m.vA===m.vB,'붙음 실패')});
test('같은 질량의 완전탄성 속도 교환',()=>{const r=solveCollision({massA:5,massB:5,speedA:7,restitution:1});assert(r.velocityA===0&&r.velocityB===7,'교환 실패')});
const summaries=[];
for(const[height,friction]of[[5,'none'],[18,'none'],[18,'heavy'],[30,'heavy']])test(`롤러코스터 ${height}m / ${friction}: 에너지 보존과 열 누적`,()=>{const m=new CoasterMotion(height,friction);let lastHeat=0;for(let i=0;i<7200&&!m.finished;i++){m.step(1/120);const e=m.energy();assert(Math.abs(e.potential+e.kinetic+e.heat-e.total)<1e-7,'에너지 합');assert(e.heat>=lastHeat-1e-8,'열 감소');assert(m.point().y<=height+1e-7,'출발보다 높음');lastHeat=e.heat;}summaries.push({height,friction,passed:m.passedLoop,turns:m.turns,s:m.s,heat:m.heat});});
test('높이가 충분하면 마찰 많음에서도 루프 통과',()=>{assert(summaries.find(s=>s.height===30&&s.friction==='heavy').passed,'30m 마찰 많음 통과 실패')});
test('낮은 출발 높이는 되돌아옴',()=>{assert(summaries.find(s=>s.height===5).turns>0,'반환 없음')});
const panel=document.getElementById('panel');const createContext=flags=>({scene:new THREE.Scene(),camera:new THREE.PerspectiveCamera(45,1.6,.1,10000),controls:{target:new THREE.Vector3(),update(){}},panel,missionFlags:flags,award(i){flags[i]=true},setMessage(){}});
test('실제 충돌 UI: 실행·미션·초기화·정리',()=>{const flags=[false,false,false];const sim=createCollision(createContext(flags));panel.querySelector('#collision-run').click();for(let i=0;i<1800;i++)sim.update(1/120);assert(flags[0],'미션');assert(panel.querySelector('#collision-state').textContent==='관찰 완료','종료');panel.querySelector('#collision-reset').click();assert(sim.getContext().current.collided===false,'초기화');sim.dispose()});
test('실제 롤러코스터 UI: 정확한 에너지 균형에서 멈춤·재개·루프',()=>{const flags=[false,false,false];const sim=createCoaster(createContext(flags));panel.querySelector('#coaster-run').click();for(let i=0;i<3000&&!flags[2];i++)sim.update(1/120);const e=sim.getContext().current;assert(flags[2]&&Math.abs(e.potential-e.kinetic)<1e-7,'균형');panel.querySelector('#coaster-run').click();for(let i=0;i<5000;i++)sim.update(1/120);assert(flags[0],'루프 미션');sim.dispose()});
document.getElementById('details').textContent=JSON.stringify(summaries,null,2);document.title=[...results.children].some(x=>x.textContent.startsWith('FAIL'))?'FAIL — 2단계':'PASS — 2단계';
</script></html>
